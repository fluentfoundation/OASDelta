name: Benchmarks & site

# Benchmarks the NativeAOT oasdelta against the official Go oasdiff release on Linux and Windows,
# then builds the VitePress site with those fresh results and deploys it to GitHub Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runs:
        description: Timed runs per case and binary
        default: "15"
  schedule:
    - cron: "0 6 * * 1" # weekly, so the numbers track runner-image and toolchain changes

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  OASDIFF_VERSION: 1.35.0 # upstream release the port is compared against
  BENCH_RESOURCES: 600 # synthetic spec size: 600 resources = 1,200 paths, 650 schemas (~1.5 MB YAML)

jobs:
  bench:
    name: Benchmark (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            slug: linux
            os: ubuntu-latest
            rid: linux-x64
            exe: oasdelta
            asset: linux_amd64
            go_exe: oasdiff
          - name: Windows
            slug: windows
            os: windows-latest
            rid: win-x64
            exe: oasdelta.exe
            asset: windows_amd64
            go_exe: oasdiff.exe
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Publish oasdelta (NativeAOT)
        run: dotnet publish src/OasDelta -c Release -r ${{ matrix.rid }} -o out

      - name: Download oasdiff ${{ env.OASDIFF_VERSION }} (official release, checksum verified)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p go && cd go
          archive="oasdiff_${OASDIFF_VERSION}_${{ matrix.asset }}.tar.gz"
          gh release download "v${OASDIFF_VERSION}" -R oasdiff/oasdiff -p "$archive" -p checksums.txt
          grep " $archive\$" checksums.txt | sha256sum -c -
          tar xzf "$archive"
          ./${{ matrix.go_exe }} --version

      - name: Generate benchmark specs
        run: |
          mkdir specs
          python tools/gen_bench_spec.py specs ${{ env.BENCH_RESOURCES }}

      - name: Check out real-world specs (OASDelta-TestData)
        id: testdata
        uses: actions/checkout@v7
        with:
          repository: fluentfoundation/OASDelta-TestData
          path: testdata

      - name: Run benchmarks
        shell: bash
        run: |
          python tools/bench.py \
            --go go/${{ matrix.go_exe }} \
            --cs out/${{ matrix.exe }} \
            --specs specs \
            --runs ${{ github.event.inputs.runs || '15' }} \
            --warmup 3 \
            --real-world testdata \
            --real-world-runs 5 \
            --real-world-commit "${{ steps.testdata.outputs.commit }}" \
            --label "${{ matrix.name }}" \
            --json ${{ matrix.slug }}.json \
            --markdown "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: bench-${{ matrix.slug }}
          path: ${{ matrix.slug }}.json

  site:
    name: Build site
    needs: bench
    # still publish the site if one platform's benchmark failed: the committed baseline fills the gap
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Use fresh benchmark results
        uses: actions/download-artifact@v8
        with:
          pattern: bench-*
          path: docs/data/benchmarks
          merge-multiple: true

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
