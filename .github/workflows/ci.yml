name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build & test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            rid: linux-x64
            exe: oasdelta
            coverage: true
          - name: Windows
            os: windows-latest
            rid: win-x64
            exe: oasdelta.exe
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Check formatting (.editorconfig)
        if: runner.os == 'Linux'
        run: dotnet format --verify-no-changes --no-restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test (unit + golden comparisons, JIT)
        run: >-
          dotnet test -c Release --no-build --logger trx --results-directory TestResults
          ${{ matrix.coverage && '--collect "XPlat Code Coverage" --settings tests/OasDelta.Tests/coverage.runsettings' || '' }}

      - name: Coverage report
        if: matrix.coverage
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: coverage
          reporttypes: Html;JsonSummary;MarkdownSummaryGithub;Cobertura

      - name: Coverage summary
        if: matrix.coverage
        shell: pwsh
        run: .github/scripts/coverage-summary.ps1 coverage/Summary.json coverage/SummaryGithub.md >> $env:GITHUB_STEP_SUMMARY

      - name: Upload coverage report
        if: matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage
          if-no-files-found: error

      - name: Publish NativeAOT
        run: dotnet publish src/OasDelta -c Release -r ${{ matrix.rid }} -o out

      - name: Golden comparisons (NativeAOT binary)
        shell: bash
        run: bash tools/check_golden.sh out/${{ matrix.exe }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rid }}
          path: TestResults
          if-no-files-found: ignore

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: oasdelta-${{ matrix.rid }}
          path: out/${{ matrix.exe }}

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run build
