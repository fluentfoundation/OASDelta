name: Emitter oracle

# Differential tests of the YAML and JSON emitters (src/OasDelta/Yaml/Emit.cs) against the Go libraries oasdiff 1.35.0
# uses: go.yaml.in/yaml/v3 v3.0.5 and encoding/json. tools/go-oracle generates a fixed-seed corpus and what yaml.Marshal
# and json.Marshal print for it into tests/emitter-oracle; the xUnit EmitterOracleTests compare the C# emitters with
# those files byte for byte, so they run everywhere without Go. This job reruns the Go program with the toolchain
# pinned in tools/go-oracle/go.mod and fails if the checked-in files are stale, then runs the comparison.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emitter-oracle-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  oracle:
    name: Emitter oracle (go-yaml, encoding/json)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go-oracle/go.mod
          cache-dependency-path: tools/go-oracle/go.sum

      - name: Regenerate the corpus and the Go outputs
        working-directory: tools/go-oracle
        run: |
          go version
          go vet .
          go run .

      - name: Check the checked-in files are what Go produces
        run: |
          if [ -n "$(git status --porcelain -- tests/emitter-oracle)" ]; then
            git status --short -- tests/emitter-oracle
            git diff --stat -- tests/emitter-oracle
            git diff -- tests/emitter-oracle | head -c 20000
            echo "::error::tests/emitter-oracle is out of date: run 'go run .' in tools/go-oracle and commit the result"
            exit 1
          fi

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Compare the C# emitters with the Go outputs
        run: dotnet test tests/OasDelta.Tests -c Release --filter "FullyQualifiedName~EmitterOracleTests"
