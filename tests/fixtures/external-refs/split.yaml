# A spec split across two files of the repository. With --allow-external-refs=false oasdiff refuses the $ref when
# the spec is read from a file, and allows it when the spec is read from a git revision (the ref is read from the
# same revision). See ExternalRefPolicyTests.
openapi: 3.0.0
info: {title: split, version: "1"}
paths:
  /pets:
    get:
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: './schemas.yaml#/Pet'}
