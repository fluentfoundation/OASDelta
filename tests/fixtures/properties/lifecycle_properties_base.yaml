# Sunset and stability rules (#43). Dates are fixed, 2020-01-01 (past) and 2099-12-31 (future), so whether a
# sunset is too soon does not change as time passes. Some rules fire only with --deprecation-days-beta/-stable.
openapi: 3.0.3
info: {title: lifecycle, version: "1"}
paths:
  /r:
    post:
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                invalid: {type: string}
                missing: {type: string}
                with-sunset: {type: string}
                removed: {type: string, deprecated: true, x-sunset: "2099-12-31"}
                decreased: {type: string, x-stability-level: stable}
                increased: {type: string, x-stability-level: beta}
                too-small: {type: string}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [required-removed]
                properties:
                  invalid: {type: string}
                  missing: {type: string}
                  with-sunset: {type: string}
                  required-removed: {type: string, deprecated: true, x-sunset: "2099-12-31"}
                  decreased: {type: string, x-stability-level: stable}
                  increased: {type: string, x-stability-level: beta}
