# A null security requirement is a nil map: "schemes": null in JSON, {} in YAML.
openapi: 3.0.3
info: {title: null security requirement, version: '1'}
security:
  - null
  - a: []
paths:
  /p:
    post:
      responses:
        '200': {description: ok}
components:
  securitySchemes:
    a: {type: http, scheme: basic}
