openapi: 3.0.3
info: {title: refs, version: '1'}
paths:
  /items:
    get:
      parameters:
        # a parameter that points at a schema: kin fails with
        # bad data in "#/components/schemas/Limit" (expecting ref to parameter object)
        - {$ref: '#/components/schemas/Limit'}
      responses:
        '200': {description: ok}
components:
  parameters:
    Limit: {name: limit, in: query, schema: {type: integer}}
  schemas:
    Limit: {type: integer}
