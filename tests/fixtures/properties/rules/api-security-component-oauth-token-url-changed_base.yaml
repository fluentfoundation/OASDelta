# Fires api-security-component-oauth-token-url-changed (tests/OasDelta.Tests/Properties/RulePromotion.cs)
components:
    securitySchemes:
        oauth:
            flows:
                authorizationCode:
                    authorizationUrl: https://auth.example.com/authorize
                    scopes:
                        read: read access
                    tokenUrl: https://auth.example.com/token
                clientCredentials:
                    refreshUrl: https://auth.example.com/refresh
                    scopes:
                        read: read access
                    tokenUrl: https://auth.example.com/token
            type: oauth2
        openid:
            openIdConnectUrl: https://auth.example.com/.well-known/openid-configuration
            type: openIdConnect
