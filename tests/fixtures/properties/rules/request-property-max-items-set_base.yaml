# Fires request-property-max-items-set (tests/OasDelta.Tests/Properties/RulePromotion.cs)
components:
    schemas:
        Item:
            type: object
    securitySchemes:
        api_key:
            in: query
            name: ключ
            type: apiKey
info:
    title: tag
    version: "2.0"
openapi: 3.0.3
paths:
    /items/{id}.json:
        post:
            operationId: post_items_{id}.json
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
                - explode: false
                  in: cookie
                  name: ඘䯫ꆚ
                  schema:
                    $ref: '#/components/schemas/Item'
            requestBody:
                content:
                    application/vnd.api+json:
                        schema:
                            properties:
                                '''single''':
                                    items:
                                        $ref: '#/components/schemas/Item'
                                    minItems: 1
                                    type: array
                                kind:
                                    items:
                                        nullable: true
                                        type: string
                                        writeOnly: true
                                    type: array
                                tag:
                                    oneOf:
                                        - $ref: '#/components/schemas/Item'
                                        - format: custom
                                          type: boolean
                                        - default: -9.75
                                          type: number
                            required:
                                - '''single'''
                                - kind
                            type: object
                    text/plain:
                        schema:
                            properties:
                                '-':
                                    anyOf:
                                        - description: pet
                                          nullable: true
                                          type: boolean
                                        - default: false
                                          deprecated: true
                                          type: boolean
                            type: object
                required: true
            responses:
                "204":
                    description: ズ車蟆
servers:
    - url: /relative
