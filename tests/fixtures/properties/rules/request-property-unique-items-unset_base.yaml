# Fires request-property-unique-items-unset (tests/OasDelta.Tests/Properties/RulePromotion.cs)
components:
    schemas:
        Item:
            format: int64
            type: integer
        Owner:
            $ref: '#/components/schemas/Item'
        Pet:
            properties:
                status:
                    readOnly: true
                    type: integer
                팊き┎㱩鲆쬁:
                    items:
                        readOnly: true
                        type:
                            - integer
                            - "null"
                    type: array
            required:
                - status
                - 팊き┎㱩鲆쬁
            type: object
    securitySchemes:
        api_key:
            in: query
            name: kind
            type: apiKey
        oauth:
            flows:
                clientCredentials:
                    scopes:
                        admin: admin access
                        read: read access
                        write: write access
                    tokenUrl: https://auth.example.com/token
            type: oauth2
info:
    title:  nbsp
    version: "2.0"
openapi: 3.1.0
paths:
    /store/order:
        post:
            operationId: post_store_order
            parameters:
                - in: header
                  name: ᳇ԯ征鶅ॳ유퇧ᮞ
                  schema:
                    description: '*star'
                    type:
                        - integer
                        - "null"
                  style: simple
            responses:
                default:
                    content:
                        application/json:
                            schema:
                                deprecated: true
                                type: object
                    description: 鷟莆ꛊ杈ꆞ
            security:
                - api_key: []
        put:
            operationId: put_store_order
            parameters:
                - in: header
                  name: created
                  schema:
                    type: object
            requestBody:
                content:
                    application/json; charset=utf-8:
                        schema:
                            items:
                                items:
                                    $ref: '#/components/schemas/Item'
                                type: array
                                uniqueItems: true
                            minItems: 0
                            type: array
                    application/xml:
                        schema:
                            description: price
                            readOnly: true
                            type:
                                - boolean
                                - "null"
            responses:
                "200":
                    description: price
    /v1/items:
        delete:
            operationId: delete_v1_items
            parameters:
                - in: cookie
                  name: pet
                  required: false
                  schema:
                    maximum: 562
                    type:
                        - integer
                        - "null"
                - in: query
                  name: ‮abc
                  required: false
                  schema:
                    type: object
            responses:
                "200":
                    description: id
