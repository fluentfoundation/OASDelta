# Fires response-body-max-decreased (tests/OasDelta.Tests/Properties/RulePromotion.cs)
components:
    schemas:
        Item:
            items:
                items:
                    description: tag
                    enum:
                        - '"quoted"'
                    format: password
                    type: string
                    writeOnly: true
                minItems: 1
                type: array
            type: array
        Owner:
            deprecated: true
            enum:
                - 9223372036854775807
                - 0
            maximum: 244
            minimum: 9
            nullable: true
            type: number
        Pet:
            anyOf:
                - items:
                    description: 뵟굪往䊄瓇ꩆ驮
                    nullable: true
                    type: number
                  type: array
                - format: custom
                  type: boolean
                - items:
                    maximum: 46
                    type: number
                  maxItems: 63
                  type: array
    securitySchemes:
        oauth:
            flows:
                clientCredentials:
                    refreshUrl: https://auth.example.com/refresh
                    scopes:
                        admin: admin access
                    tokenUrl: https://auth.example.com/token
            type: oauth2
        openid:
            openIdConnectUrl: https://auth.example.com/.well-known/openid-configuration
            type: openIdConnect
info:
    title: "\U0001F600"
    version: 1.0.0
openapi: 3.0.3
paths:
    /owners/{ownerId}/pets:
        patch:
            operationId: patch_owners_{ownerId}_pets
            parameters:
                - in: path
                  name: ownerId
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: tag
                    headers:
                        id:
                            schema:
                                default: '|'
                                type: string
                        owner:
                            required: true
                            schema:
                                nullable: true
                                type: boolean
                "204":
                    description: pet
                "400":
                    content:
                        '*/*':
                            schema:
                                $ref: '#/components/schemas/Owner'
                    description: 돤꒒Ძ᪊齴ᐲ
                    headers:
                        '*star':
                            schema:
                                format: custom
                                type: boolean
                        created:
                            deprecated: true
                            schema:
                                description: 신粕㢧谇轹欄
                                example: '#hash'
                                format: double
                                maximum: 630
                                nullable: true
                                readOnly: true
                                type: number
            x-stability-level: beta
        put:
            operationId: put_owners_{ownerId}_pets
            parameters:
                - in: path
                  name: ownerId
                  required: true
                  schema:
                    type: string
                - explode: false
                  in: query
                  name: '**bold**'
                  schema:
                    type: integer
            responses:
                default:
                    content:
                        '*/*':
                            schema:
                                items:
                                    allOf:
                                        - nullable: true
                                          readOnly: true
                                          type: boolean
                                        - description: 名前
                                          type: boolean
                                type: array
                        application/json:
                            schema:
                                items:
                                    additionalProperties:
                                        type: string
                                    properties:
                                        '&anchor':
                                            description: 䲛䟧
                                            format: custom
                                            nullable: true
                                            readOnly: true
                                            type: boolean
                                        '| table |':
                                            enum:
                                                - name
                                            nullable: true
                                            type: string
                                        created:
                                            nullable: true
                                            type: integer
                                        id:
                                            $ref: '#/components/schemas/Item'
                                    required:
                                        - created
                                        - id
                                        - '| table |'
                                    type: object
                                maxItems: 57
                                type: array
                    description: price
            security:
                - oauth: []
