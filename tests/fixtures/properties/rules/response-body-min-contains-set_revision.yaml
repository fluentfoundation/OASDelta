components:
    schemas:
        Owner:
            items:
                format: double
                type: number
            minItems: 2
            type: array
        Pet:
            $ref: '#/components/schemas/Owner'
    securitySchemes:
        oauth:
            flows:
                authorizationCode:
                    authorizationUrl: https://auth.example.com/authorize
                    scopes:
                        read: read access
                    tokenUrl: https://auth.example.com/token
                clientCredentials:
                    scopes:
                        read: read access
                    tokenUrl: https://auth.example.com/token
            type: oauth2
        openid:
            openIdConnectUrl: https://auth.example.com/.well-known/openid-configuration
            type: openIdConnect
