# Fires response-body-type-generalized (tests/OasDelta.Tests/Properties/RulePromotion.cs)
components:
    schemas:
        Error:
            $ref: '#/components/schemas/Owner'
        Owner:
            items:
                $ref: '#/components/schemas/Pet'
            maxItems: 15
            type: array
        Pet:
            items:
                items:
                    nullable: true
                    pattern: '[^\n]'
                    type: string
                type: array
            type: array
    securitySchemes:
        api_key:
            in: query
            name: ключ
            type: apiKey
        bearer:
            bearerFormat: JWT
            scheme: basic
            type: http
info:
    title: '{brace}'
    version: "2.0"
openapi: 3.0.3
paths:
    /ünïcode/ключ:
        delete:
            parameters:
                - in: query
                  name: owner
                  schema:
                    anyOf:
                        - enum:
                            - -9223372036854775808
                          nullable: true
                          type: number
                        - $ref: '#/components/schemas/Error'
                        - $ref: '#/components/schemas/Pet'
            responses:
                2XX:
                    description: kind
                "204":
                    content:
                        text/plain:
                            schema:
                                type: number
                    description: owner
                default:
                    content:
                        application/json; charset=utf-8:
                            schema:
                                type: number
                    description: "0x1F"
security:
    - bearer: []
