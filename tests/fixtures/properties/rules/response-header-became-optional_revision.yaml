# Fires response-header-became-optional (tests/OasDelta.Tests/Properties/RulePromotion.cs)
components:
    schemas:
        Owner:
            enum:
                - true
                - false
            nullable: true
            type: boolean
info:
    title: '*star'
    version: "2.0"
openapi: 3.0.3
paths:
    /owners/{ownerId}/pets:
        delete:
            operationId: delete_owners_{ownerId}_pets
            parameters:
                - in: path
                  name: ownerId
                  required: true
                  schema:
                    type: string
                - explode: false
                  in: header
                  name: owner
                  schema:
                    description: owner
                    properties:
                        tag:
                            $ref: '#/components/schemas/Owner'
                    required:
                        - tag
                    type: object
                  style: pipeDelimited
                - description: name
                  in: cookie
                  name: ключ
                  required: false
                  schema:
                    description: <b>&amp;
                    nullable: true
                    type: number
                - in: header
                  name: id
                  required: true
                  schema:
                    $ref: '#/components/schemas/Owner'
            responses:
                2XX:
                    description: owner
                    headers:
                        '#hash':
                            required: true
                            schema:
                                example: name
                                nullable: true
                                type: number
                        名前:
                            required: false
                            schema:
                                description: owner
                                type: string
                "201":
                    content:
                        application/json; charset=utf-8:
                            schema:
                                example: "0x1F"
                                format: int64
                                type: integer
                    description: '''single'''
                    headers:
                        owner:
                            schema:
                                example: tag
                                maximum: 420
                                nullable: true
                                type: integer
