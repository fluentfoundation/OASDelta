# Fires response-optional-property-became-read-only (tests/OasDelta.Tests/Properties/RulePromotion.cs)
components:
    schemas:
        Owner:
            additionalProperties:
                type: string
            type: object
        Pet:
            $ref: '#/components/schemas/Owner'
    securitySchemes:
        api_key:
            in: header
            name: price
            type: apiKey
        oauth:
            flows:
                clientCredentials:
                    scopes:
                        read: read access
                        write: write access
                    tokenUrl: https://auth.example.com/token
            type: oauth2
info:
    title: created
    version: "2.0"
openapi: 3.1.0
paths:
    /items/{id}.json:
        get:
            operationId: get_items_{id}.json
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: status
        put:
            operationId: put_items_{id}.json
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
                - in: cookie
                  name: ⎴鯮彋좹퇵
                  schema:
                    items:
                        enum:
                            - true
                            - false
                        type:
                            - boolean
                            - "null"
                    maxItems: 30
                    type: array
                - description: 甆䞒䣠ᜄ
                  in: header
                  name: id
                  required: true
                  schema:
                    items:
                        type: boolean
                    type: array
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            description: name
                            type:
                                - boolean
                                - "null"
            responses:
                "204":
                    content:
                        application/vnd.api+json:
                            schema:
                                properties:
                                    '''single''':
                                        type: object
                                    ? "a\r\nb"
                                    :   items:
                                            enum:
                                                - '[bracket]'
                                            format: uuid
                                            maxLength: 159
                                            type:
                                                - string
                                                - "null"
                                            writeOnly: true
                                        readOnly: true
                                        type: array
                                    price:
                                        type: number
                                required:
                                    - price
                                type: object
                    description: price
            tags:
                - created
                - tag
servers:
    - url: https://api.example.com
