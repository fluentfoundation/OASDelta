# Fires response-property-exclusive-max-set (tests/OasDelta.Tests/Properties/RulePromotion.cs)
components:
    schemas:
        Error:
            enum:
                - 60
            type:
                - number
                - "null"
        Item:
            format: int32
            type:
                - integer
                - "null"
    securitySchemes:
        bearer:
            scheme: basic
            type: http
        openid:
            openIdConnectUrl: https://auth.example.com/.well-known/openid-configuration
            type: openIdConnect
info:
    title: price
    version: "2.0"
openapi: 3.1.0
paths:
    /store/order:
        patch:
            parameters:
                - in: query
                  name: name
                  schema:
                    oneOf:
                        - $ref: '#/components/schemas/Item'
                        - default: owner
                          minLength: 3
                          type: string
                        - $ref: '#/components/schemas/Error'
            responses:
                "201":
                    content:
                        application/xml:
                            schema:
                                maxLength: 236
                                type: string
                    description: name
                    headers:
                        '&anchor':
                            schema:
                                type: string
                                writeOnly: true
                        名前:
                            required: false
                            schema:
                                exclusiveMinimum: -10
                                type:
                                    - integer
                                    - "null"
                "204":
                    content:
                        '*/*':
                            schema:
                                allOf:
                                    - default: 1.23456789125e+08
                                      exclusiveMaximum: 1785
                                      format: int64
                                      minimum: 2
                                      type: integer
                                    - minimum: 3
                                      type: number
                        application/vnd.api+json:
                            schema:
                                $ref: '#/components/schemas/Item'
                    description: kind
                "500":
                    description: "no"
            tags:
                - tag
                - pet
