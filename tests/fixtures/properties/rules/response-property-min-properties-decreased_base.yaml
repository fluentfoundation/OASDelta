# Fires response-property-min-properties-decreased (tests/OasDelta.Tests/Properties/RulePromotion.cs)
components:
    schemas:
        Item:
            enum:
                - 28
                - -3
            format: double
            minimum: -7
            type: number
        Owner:
            type: object
        Pet:
            type: object
info:
    title: ключ
    version: "2.0"
openapi: 3.1.0
paths:
    /v1/items:
        patch:
            operationId: patch_v1_items
            parameters:
                - in: query
                  name: kind
                  required: true
                  schema:
                    type: object
            requestBody:
                content:
                    application/json:
                        schema:
                            additionalProperties: true
                            type: object
                required: true
            responses:
                "201":
                    content:
                        text/plain:
                            schema:
                                pattern: ^[a-z]+$
                                type:
                                    - string
                                    - "null"
                    description: pet
                "400":
                    content:
                        application/json:
                            schema:
                                properties:
                                    '!tag':
                                        properties:
                                            kind:
                                                minimum: 2
                                                type:
                                                    - integer
                                                    - "null"
                                        type: object
                                    created:
                                        type: string
                                required:
                                    - created
                                    - '!tag'
                                type: object
                        multipart/form-data:
                            schema:
                                allOf:
                                    - anyOf:
                                        - readOnly: true
                                          type: boolean
                                        - type:
                                            - string
                                            - "null"
                                        - description: 名前
                                          multipleOf: 10
                                          type: number
                                    - minProperties: 4
                                      type: object
                    description: 名前
                    headers:
                        id:
                            schema:
                                type: number
                "404":
                    description: price
